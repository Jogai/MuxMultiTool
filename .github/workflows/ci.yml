# The CI gate for pull requests and master. The `changes` job decides which jobs
# run for the changed paths (docs/quality.md, "Shared: CI triggers"); a docs-only
# change runs nothing. The `ci` job at the end is the one check to require in
# branch protection.
#
# A `v*` tag (pushed by release.yml) runs everything and ends with the GitHub
# release: the desktop installers attached, git-cliff's notes as the body. A
# manual run does the same for the chosen ref; release.yml uses that when its
# token cannot trigger the tag push.
name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # paths-filter lists the files of a pull request through the API.
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation only costs time in CI, the caches hold whole crates.
  CARGO_INCREMENTAL: 0
  NODE_VERSION: 26
  ZIG_VERSION: 0.17.0

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend || steps.all.outputs.all }}
      frontend: ${{ steps.filter.outputs.frontend || steps.all.outputs.all }}
      proto: ${{ steps.filter.outputs.proto || steps.all.outputs.all }}
      desktop: ${{ steps.filter.outputs.desktop || steps.all.outputs.all }}
    steps:
      - uses: actions/checkout@v7
      # A tag or a manual run has no "changed paths": everything runs.
      - name: Everything runs for a tag or a manual run
        id: all
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: echo "all=true" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: filter
        if: steps.all.outputs.all != 'true'
        with:
          filters: |
            # Shared code, the lockfile, the toolchain and the CI itself: everything runs.
            everything: &everything
              - crates/core/**
              - crates/proto/**
              - Cargo.lock
              - Cargo.toml
              - rust-toolchain.toml
              - .github/**
            # Backend checks, plus later the container image (server, Dockerfile).
            backend:
              - *everything
              - crates/**
              - Dockerfile
              - clippy.toml
              - deny.toml
              - rustfmt.toml
              - taplo.toml
              - typos.toml
            # Frontend checks; later also the image and desktop builds, which embed it.
            frontend:
              - *everything
              - web/**
            # Contract lint, format and breaking-change checks.
            proto:
              - crates/proto/**
              - .github/**
            # The desktop installers: the Tauri crate, the server it embeds and the
            # frontend it bundles (web/package-lock.json pins the Tauri CLI).
            desktop:
              - *everything
              - crates/server/**
              - crates/desktop/**
              - web/**

  # `buf generate` once; the backend and frontend jobs download the result. The
  # generated code is git-ignored, see development.md ("RPC contract and generated code").
  codegen:
    name: Generate RPC code
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the web dependencies (protoc-gen-es)
        run: npm ci --no-audit --no-fund
        working-directory: web
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      # The Rust plugins have no binary releases; a cache miss compiles them once.
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: protoc-gen-buffa@0.9.2
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: protoc-gen-buffa-packaging@0.9.2
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: connectrpc-codegen@0.9.0
      - name: Generate the Rust and TypeScript code
        run: buf generate
        working-directory: crates/proto
      - uses: actions/upload-artifact@v7
        with:
          name: generated-rpc-code
          path: |
            crates/proto/src/generated
            web/src/generated
          retention-days: 1
          if-no-files-found: error

  backend-lint:
    name: Backend lint
    needs: [changes, codegen]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: generated-rpc-code
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-shear,cargo-hack,taplo,typos
      - name: Format
        run: cargo fmt --all --check
      # Without `--all-features`: the desktop crate's `cef` feature (the Linux
      # shell) needs GTK 4 and the CEF download, and is linted in the Linux
      # desktop job instead.
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: TOML
        run: taplo fmt --check
      - name: Spelling
        run: typos
      - name: Dependencies (advisories, licenses, bans, sources)
        run: cargo deny check
      - name: Unused dependencies
        run: cargo shear
      - name: Feature combinations
        run: cargo hack check --each-feature --workspace --locked --exclude-features cef

  backend-test:
    name: Backend tests
    needs: [changes, codegen]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: generated-rpc-code
      - uses: ./.github/actions/rust-toolchain
      - name: Install llvm-tools (coverage)
        run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      # The tests run ffmpeg and ffprobe: the desktop app's pinned build.
      - uses: ./.github/actions/ffmpeg
      # The generated RPC code is left out of the report; it isn't ours to cover.
      - name: Tests with coverage
        run: cargo llvm-cov nextest --workspace --locked --ignore-filename-regex '/generated/' --lcov --output-path lcov.info
      - name: Coverage summary
        run: |
          {
            echo '## Coverage'
            echo '```'
            cargo llvm-cov report --summary-only --ignore-filename-regex '/generated/'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info

  # The server must link statically, so a C dependency fails here before it reaches master.
  backend-musl:
    name: Backend static musl build
    needs: [changes, codegen]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: generated-rpc-code
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build the server for x86_64-unknown-linux-musl
        run: cargo zigbuild --target x86_64-unknown-linux-musl --locked -p muxmultitool-server

  # The steps in the order of docs/quality.md, "Frontend – CI order". vue-tsc is the
  # only step that checks components, so it is never optional.
  frontend:
    name: Frontend
    needs: [changes, codegen]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: generated-rpc-code
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format (oxfmt)
        run: npm run format:check
      - name: Lint (oxlint, type-aware)
        run: npm run lint
      - name: Type-check, fast (TS 7)
        run: npm run typecheck:ts7
      - name: Type-check, strict (vue-tsc)
        run: npm run typecheck:vue
      - name: Build
        run: npm run build
      - name: Unit tests (Vitest)
        run: npm test

  contract:
    name: RPC contract
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/proto
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Lint
        run: buf lint
      - name: Format
        run: buf format -d --exit-code
      # breaking.sh compares with a local branch: the PR base, or for a push the
      # commit before it. A branch creation has no "before" commit to compare with.
      - name: Breaking changes
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          git branch --force ci-base FETCH_HEAD
          ./breaking.sh ci-base

  # The desktop installers (development.md, "Desktop app"): the Tauri app with the server
  # embedded, the built frontend as a resource and ffmpeg/ffprobe as sidecars. The
  # Apple Silicon runner also cross-compiles the Intel build. macOS signing and
  # notarization run when the Apple secrets exist; Windows signing is not set up
  # yet. Both are release blockers, documented in development.md.
  #
  # Linux builds on the Tauri CEF runtime (architecture.md, "Desktop specifics"):
  # `tauri.linux.conf.json` turns on the crate's `cef` feature, the `cef-dll-sys`
  # build script downloads the pinned CEF binary distribution into the cached
  # `~/.cache/tauri-cef` folder, and the bundler ships it in the deb and AppImage.
  # The AppImage bundler (quick-sharun) runs the app for a few seconds under
  # xvfb to find the libraries it loads, hence the X virtual framebuffer.
  # Known to fail at the bundling step with this alpha (tauri-bundler copies
  # ANGLE libraries that the Linux CEF distribution does not ship, see
  # architecture.md "Linux desktop app as built", issue 1); the compile and
  # link still run, and a bundler fix is a version bump away.
  desktop:
    name: Desktop (${{ matrix.target }})
    needs: [changes, codegen]
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    env:
      # Only a job-level env can look at the secrets; the step below reads this.
      APPLE_SIGNING: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: generated-rpc-code
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # GTK 4 for the CEF runtime's windows and the tools of the Linux bundlers.
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev patchelf strace xvfb dbus-x11 binutils file
      - name: Cache the CEF binary distribution
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/tauri-cef
          # The `cef` crate version in the lockfile names the CEF build.
          key: cef-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cef-${{ matrix.target }}-
      # The `cef` feature is kept out of the backend lint job (no GTK 4 there).
      - name: Lint the CEF shell
        if: runner.os == 'Linux'
        run: CEF_PATH="$HOME/.cache/tauri-cef" cargo clippy -p muxmultitool-desktop --features cef --all-targets --locked -- -D warnings
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the web dependencies (the Tauri CLI among them)
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Build the frontend (bundled as the web/ resource)
        run: npm run build
        working-directory: web
      - name: Fetch the ffmpeg and ffprobe sidecars
        run: crates/desktop/scripts/fetch-sidecars.sh ${{ matrix.target }}
        shell: bash
      # The Tauri CLI signs and notarizes the macOS bundle when these variables are
      # set; an empty value would not do, so they are only exported when they exist.
      - name: Apple signing credentials
        if: runner.os == 'macOS' && env.APPLE_SIGNING == 'true'
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"
      - name: Build the installer
        run: npx tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        working-directory: web
        env:
          TAURI_APP_PATH: ../crates/desktop
          TAURI_FRONTEND_PATH: .
      # The bundle sizes, in the job summary: the architecture doc records them.
      - name: Bundle sizes
        shell: bash
        run: |
          {
            echo "### Bundles for ${{ matrix.target }}"
            echo
            echo '```'
            find target/${{ matrix.target }}/release/bundle -maxdepth 2 \
              \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
              -exec du -h {} +
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Conventional Commits, because git-cliff works out the next version from them.
  # Merge commits are left alone, so a branch may merge master instead of rebasing.
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: committed@1.1.11
      - name: Check every commit against committed.toml
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            committed -vv "$commit~..$commit"
          done

  # The GitHub release for a `v*` tag (development.md, "Releases"): the notes git-cliff
  # renders for that version as the body, the desktop installers attached. It
  # is published when every check passed; when one failed it is left a draft
  # with whatever was built, for someone to look at (the Linux bundling is
  # known to fail with the current Tauri alpha, see the desktop job).
  release:
    name: GitHub release
    needs: [codegen, backend-lint, backend-test, backend-musl, frontend, contract, desktop]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff needs the history back to the previous tag.
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Release notes for ${{ github.ref_name }}
        run: git cliff --current --strip all > notes.md
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: bundles
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
        run: |
          shopt -s nullglob
          flags=()
          if [[ "$FAILED" == true ]]; then
            flags+=(--draft)
            echo "::warning::a check failed on $TAG: the release is a draft"
          fi
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "${flags[@]}" bundles/*
          echo "::notice::release $TAG created with $(ls bundles | wc -l) installer(s)"

  # The one status check to require: green when every job passed or was skipped.
  ci:
    name: CI
    needs: [changes, codegen, backend-lint, backend-test, backend-musl, frontend, contract, desktop, commits, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
