[workspace]
resolver = "3"
members = ["crates/core", "crates/proto", "crates/server", "crates/desktop"]

# Shared package metadata. Crates inherit a field with `<field>.workspace = true`.
[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/Jogai/MuxMultiTool"
publish = false

# Lints are defined once here. Every crate inherits them with `[lints] workspace = true`.
# Project-specific rules (MSRV, disallowed methods) live in clippy.toml.
[workspace.lints.rust]
unsafe_code = "forbid" # Tauri glue may opt out locally with a justification
missing_docs = "warn" # public API of core
rust_2024_compatibility = { level = "warn", priority = -1 }
# Generated Connect service traits return `impl Future<Output = ServiceResult<impl Encodable<..>>>`.
# Implementing them as `async fn -> ServiceResult<Response>` refines that, which is fine:
# the service types are crate-private, nothing depends on the refined signature.
refining_impl_trait = { level = "allow", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny" # use tracing
large_futures = "warn"
