[package]
name = "muxmultitool-server"
description = "MuxMultiTool server: Connect RPC, media HTTP routes and the static frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = [
	"http1",
	"http2",
	"tokio",
] }
clap = { version = "4.6.7", features = ["derive", "env"] }
connectrpc = { version = "0.9", default-features = false, features = [
	"axum",
	"gzip",
	"json",
] }
futures-util = { version = "0.3.34", default-features = false }
muxmultitool-core = { path = "../core", version = "0.1.0" }
muxmultitool-proto = { path = "../proto", version = "0.1.0" }
percent-encoding = "2.3.2"
tokio = { version = "1.54.1", features = [
	"rt-multi-thread",
	"macros",
	"net",
	"signal",
] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
	"env-filter",
	"fmt",
] }

[dev-dependencies]
base64 = "0.22.1"
buffa = "0.9"
connectrpc = { version = "0.9", default-features = false, features = [
	"client",
] }
http = "1.5.0"
http-body-util = "0.1"
serde_json = "1.0.154"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
