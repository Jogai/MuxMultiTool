[package]
name = "muxmultitool-core"
description = "MuxMultiTool core: ffprobe, stream rules, cutting and the job queue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22.1"
getrandom = { version = "0.4.3", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
	"process",
	"io-util",
	"time",
	"macros",
	"rt",
	"sync",
	"fs",
] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
