# Generated code is not committed. Run `buf generate` in this folder (see development.md).
version: v2
clean: true
plugins:
  # Rust messages (buffa) and Connect service stubs
  - local: protoc-gen-buffa
    out: src/generated/buffa
    opt: [views=true, json=true]
    # One invocation for every file, so a message from another package (jobs
    # refers to gif) is a known type instead of a dangling-path warning.
    strategy: all
  - local: protoc-gen-buffa-packaging
    out: src/generated/buffa
    strategy: all
  - local: protoc-gen-connect-rust
    out: src/generated/connect
    opt: [buffa_module=crate::proto]
  - local: protoc-gen-buffa-packaging
    out: src/generated/connect
    strategy: all
    opt: [filter=services]
  # TypeScript messages and service descriptors (protobuf-es)
  - local: [node, ../../web/node_modules/@bufbuild/protoc-gen-es/bin/protoc-gen-es]
    out: ../../web/src/generated
    opt: [target=ts]
