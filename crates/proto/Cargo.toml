[package]
name = "muxmultitool-proto"
description = "MuxMultiTool RPC contract: the .proto files and the generated Rust code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
buffa = { version = "0.9", features = ["json"] }
buffa-types = { version = "0.9", features = ["json"] }
connectrpc = { version = "0.9", default-features = false, features = [
	"client",
	"gzip",
	"json",
] }
serde = { version = "1", features = ["derive"] }

# cargo-shear skips git-ignored files, so it can't see that the generated code
# uses these.
[package.metadata.cargo-shear]
ignored = ["connectrpc", "serde"]

[lints]
workspace = true
