# Commit message rules, checked by `committed` in CI and in the commit-msg hook.
# Conventional Commits, because git-cliff works out the next version from them
# (docs/quality.md, "Releases with git-cliff").
style = "conventional"
# Subjects are lowercase: `feat(core): add the job queue`.
subject_capitalized = false
# 100, not 72 (the default for both): Renovate subjects name the whole
# image or package, e.g.
# `chore(deps): update docker.io/library/busybox:1.38.0-musl docker digest to 80e38f9`.
subject_length = 100
line_length = 100
allowed_types = [
	"feat",
	"fix",
	"build",
	"chore",
	"ci",
	"docs",
	"perf",
	"refactor",
	"revert",
	"style",
	"test",
]
