[files]
extend-exclude = [
	"package-lock.json",
	"Cargo.lock",
	"web/src/*.d.ts",
	# binary, but the pre-commit hook passes staged files by name
	"crates/desktop/icons/*",
]

[default.extend-words]
# HTMLMediaElement event name
seeked = "seeked"
# The flate2 crate (deflate)
flate = "flate"
# ISO 639-2/B language code for French, as ffmpeg tags streams
fre = "fre"
# ISO 639-2/B language code for Welsh
wel = "wel"
