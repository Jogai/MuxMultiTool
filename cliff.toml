# git-cliff: the changelog and the next version, from the Conventional Commits
# that committed.toml enforces (docs/quality.md, "Releases with git-cliff").
# The release workflow (.github/workflows/release.yml) runs it; by hand:
#
#   git cliff --bumped-version          # the next tag
#   git cliff --bump --unreleased       # the notes it would publish
#
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to MuxMultiTool. The entries are generated by
[git-cliff](https://git-cliff.org) from the commit messages.

"""
# One section per release; the compare link at the end of each section.
body = """
{% if version %}\
	## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
	## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
	### {{ group | striptags | trim | upper_first }}
	{% for commit in commits %}
		- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
			{% if commit.breaking %}[**breaking**] {% endif %}\
			{{ commit.message }} \
			([{{ commit.id | truncate(length=7, end="") }}](<REPO>/commit/{{ commit.id }}))\
	{% endfor %}
{% endfor %}
{% if version and previous.version %}\
	[{{ version | trim_start_matches(pat="v") }}]: <REPO>/compare/{{ previous.version }}...{{ version }}
{% elif version %}\
	[{{ version | trim_start_matches(pat="v") }}]: <REPO>/releases/tag/{{ version }}
{% endif %}\n
"""
footer = ""
trim = true
render_always = true
postprocessors = [
	{ pattern = '<REPO>', replace = "https://github.com/Jogai/MuxMultiTool" },
]

[git]
conventional_commits = true
# The two bootstrap commits predate the commit rules; everything after them is conventional.
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
# The types of committed.toml, in the order they appear in a release.
commit_parsers = [
	{ message = "^chore\\(release\\)", skip = true },
	{ message = "^feat", group = "<!-- 00 -->Features" },
	{ message = "^fix", group = "<!-- 01 -->Bug fixes" },
	{ message = "^perf", group = "<!-- 02 -->Performance" },
	{ message = "^refactor", group = "<!-- 03 -->Refactoring" },
	{ message = "^docs", group = "<!-- 04 -->Documentation" },
	{ message = "^test", group = "<!-- 05 -->Tests" },
	{ message = "^build\\(deps", group = "<!-- 06 -->Dependencies" },
	{ message = "^build", group = "<!-- 07 -->Build" },
	{ message = "^ci", group = "<!-- 08 -->CI" },
	{ message = "^style", group = "<!-- 09 -->Style" },
	{ message = "^revert", group = "<!-- 10 -->Reverts" },
	{ message = "^chore", group = "<!-- 11 -->Chores" },
]
filter_commits = false
# Release tags only: `v1.2.3`. Other tags (such as `pre-linear`) are neither
# releases nor a version to bump from.
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"

[bump]
# The first release; after that the version is bumped from the last `v*` tag.
initial_tag = "v0.1.0"
# A feature bumps the minor version, a fix the patch version. Before 1.0 a
# breaking change bumps the minor version too; from 1.0 on it bumps the major.
features_always_bump_minor = true
breaking_always_bump_major = false
